name: Docker Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build for testing"
        required: true
        default: "main"
      tag:
        description: "Preview tag (e.g. rc-foo). Empty = rc-<shortsha>."
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve preview tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "preview_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "preview_tag=rc-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved: $(grep preview_tag "$GITHUB_OUTPUT")"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.preview_tag }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.preview_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
